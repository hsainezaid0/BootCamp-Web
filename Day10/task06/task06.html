<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Task 06 — Save products | Day 10
        </title>
        <link href="../style.css" rel="stylesheet">
    </head>
    <body>
        <main>
            <a href="../index.html">
                Day 10 / All exercises
            </a>
            <h1>
                Task 06 — Save products
            </h1>
            <p>
                An existing type + brand updates its price and stock. A new pair creates a product.
            </p>
            <form id="form" novalidate>
                <div class="field">
                    <label for="type">
                        Type
                    </label>
                    <input type="text" id="type" name="type" value="shoes">
                </div>
                <div class="field">
                    <label for="brand">
                        Brand
                    </label>
                    <input type="text" id="brand" name="brand" value="geox">
                </div>
                <div class="field">
                    <label for="price">
                        Price (zero or a positive integer)
                    </label>
                    <input type="text" id="price" name="price" value="50">
                </div>
                <div class="field">
                    <label for="number">
                        Number (stock)
                    </label>
                    <input type="text" id="number" name="number" value="10">
                </div>
                <button>
                    Save product
                </button>
            </form>
            <p id="status" role="status">
            </p>
        </main>
        <script src="task06.js" defer>
        </script>
    </body>
</html>
